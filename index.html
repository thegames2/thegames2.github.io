<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS Jailbreak Hub</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #05070d;
      color: white;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 7, 13, .85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid #202638;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #4da3ff;
    }

    nav a {
      color: #bbb;
      text-decoration: none;
      margin-left: 30px;
      transition: .3s;
    }

    nav a:hover {
      color: #4da3ff;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 7% 60px;
      background:
        radial-gradient(circle at 70% 40%, #164a8a55, transparent 35%),
        linear-gradient(135deg, #05070d, #0a1020);
    }

    .hero-content {
      max-width: 700px;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 30px;
      background: #102c4d;
      color: #65b2ff;
      margin-bottom: 25px;
      font-size: 14px;
    }

    h1 {
      font-size: clamp(45px, 7vw, 85px);
      line-height: 1;
      margin-bottom: 25px;
    }

    h1 span {
      color: #4da3ff;
    }

    .hero p {
      color: #aeb6c7;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 15px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: .3s;
    }

    .primary {
      background: #147cff;
      color: white;
    }

    .primary:hover {
      background: #3992ff;
      transform: translateY(-2px);
    }

    .secondary {
      border: 1px solid #344056;
      color: white;
    }

    .secondary:hover {
      border-color: #4da3ff;
      color: #4da3ff;
    }

    section {
      padding: 90px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title h2 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .section-title p {
      color: #8e98ab;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: #0c111d;
      border: 1px solid #20283a;
      padding: 30px;
      border-radius: 15px;
      transition: .3s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #247ed8;
    }

    .icon {
      font-size: 35px;
      margin-bottom: 20px;
    }

    .card h3 {
      margin-bottom: 12px;
    }

    .card p {
      color: #8f9aad;
      line-height: 1.6;
    }

    .versions {
      background: #080c15;
    }

    .console {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 25px;
      background: #0d1422;
      border: 1px solid #222d41;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .status {
      color: #4ee38b;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 35px;
      border-top: 1px solid #202638;
      color: #697386;
    }

    @media(max-width: 700px) {
      nav {
        display: none;
      }

      header {
        padding: 18px 5%;
      }

      .hero {
        padding-left: 5%;
        padding-right: 5%;
      }

      section {
        padding-left: 5%;
        padding-right: 5%;
      }
    }
  </style>
</head>
